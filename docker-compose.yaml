version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: codebreaker-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    image: codebreaker-backend
    container_name: codebreaker-backend
    depends_on:
    - postgres
    ports:
    - "8081:8081"
    env_file:
    - .env
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - C:/codebreaker-executor:/executor
    restart: unless-stopped


  frontend:
    image: codebreaker-frontend
    container_name: codebreaker-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    restart: unless-stopped

volumes:
  postgres_data:
