
services:
  postgres:
    image: postgres:15-alpine
    container_name: codebreaker-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          memory: 256M
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: codebreaker-mq
    ports:
      - "5672:5672"
      - "15672:15672"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 256M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: codebreaker-redis
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codebreaker-backend
    depends_on:
      - postgres
      - rabbitmq
      - redis
      - code-executor
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - EXECUTOR_SERVICE_URL=http://code-executor:8081/api/execute
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/codebreaker
      - RABBITMQ_HOST=rabbitmq
    deploy:
      resources:
        limits:
          memory: 1024M
    restart: unless-stopped

  code-executor:
    build:
      context: ./code-executor
      dockerfile: Dockerfile
    container_name: code-executor
    depends_on:
      - rabbitmq
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_LISTENER_SIMPLE_PREFETCH=1
    tmpfs:
      - /executor:size=512M
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
        reservations:
          memory: 1024M
    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codebreaker-frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          memory: 256M
    restart: unless-stopped

volumes:
  postgres_data: