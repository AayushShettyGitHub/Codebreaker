services:
  postgres:
    image: postgres:16-alpine
    container_name: codebreaker-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: codebreaker-mq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_volume:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: codebreaker-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_volume:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codebreaker-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_healthy
      code-executor:
        condition: service_started
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - EXECUTOR_SERVICE_URL=http://code-executor:8081/api/execute
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - RABBITMQ_HOST=rabbitmq
    deploy:
      resources:
        limits:
          memory: 1024M

  code-executor:
    build:
      context: ./code-executor
      dockerfile: Dockerfile
    restart: always
    depends_on:
      rabbitmq:
        condition: service_started
    env_file:
      - .env
    environment:
      - RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_LISTENER_SIMPLE_PREFETCH=1
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4096M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codebreaker-frontend
    restart: always
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

volumes:
  postgres_volume:
  redis_volume:
  rabbitmq_volume: